name: API Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-memory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/game_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest

  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scandium
          POSTGRES_USER: scandium
          POSTGRES_PASSWORD: scandium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scandium -d scandium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCANDIUM_DATABASE_URL: postgresql://scandium:scandium@localhost:5432/scandium
    defaults:
      run:
        working-directory: services/game_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest
