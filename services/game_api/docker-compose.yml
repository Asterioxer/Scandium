services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scandium
      POSTGRES_USER: scandium
      POSTGRES_PASSWORD: scandium
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scandium -d scandium"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/game_api
    environment:
      SCANDIUM_DATABASE_URL: postgresql://scandium:scandium@postgres:5432/scandium
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
